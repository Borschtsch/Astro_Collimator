[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-astro-collimator"
dynamic = ["version"]
description = "Offline collimation assistance for Newtonian telescopes"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "opencv-python>=4.10,<6",
    "Pillow>=10,<13",
    "numpy>=1.26,<3",
    "qrcode>=8,<9",
    "cryptography>=44,<51",
    "pillow-heif>=1,<2",
]

[tool.setuptools.packages.find]
include = ["source*"]

[tool.setuptools.dynamic]
version = {attr = "source.__version__"}

[tool.setuptools.package-data]
source = ["web/*.html", "web/*.js"]
